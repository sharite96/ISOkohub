<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IsokoHub Global</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><div class="logo">IsokoHub <span>🌍</span></div><input id="search" placeholder="Search products, services or sellers…"><button onclick="searchProducts()">Search</button><button class="ghost" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button></div></header><section class="hero"><div><p class="tag">GLOBAL MARKETPLACE</p><h1>Buy. Sell. Grow.<br>Anywhere in the world.</h1><p>Discover products and connect with sellers worldwide.</p><button class="primary" onclick="document.getElementById('products').scrollIntoView()">Shop now</button><button class="secondary" onclick="alert('Seller registration will be connected to the backend in the next version.')">Sell on IsokoHub</button></div></section><section class="wrap"><h2>Categories</h2><div class="cats"><button onclick="filter('Fashion')">👕 Fashion</button><button onclick="filter('Electronics')">📱 Electronics</button><button onclick="filter('Home')">🏠 Home</button><button onclick="filter('Beauty')">💄 Beauty</button><button onclick="filter('Vehicles')">🚗 Vehicles</button><button onclick="filter('Services')">🛠️ Services</button></div><div class="row"><h2 id="products">Featured products</h2><button class="link" onclick="render(products)">View all</button></div><div id="grid" class="grid"></div></section><footer><b>IsokoHub 🌍</b><p>Global marketplace • Buyer • Seller • Admin</p><small>Demo version — payments, database and live deployment are not connected yet.</small></footer><script src="app.js"></script></body></html>
