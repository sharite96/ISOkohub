name = "isokohub"
pages_build_output_dir = "."
compatibility_date = "2026-09-04"

# Create the D1 database in Cloudflare and replace database_id below.
[[d1_databases]]
binding = "DB"
database_name = "isokohub-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Create the R2 bucket in Cloudflare and replace the bucket name below.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "isokohub-images"

[vars]
APP_NAME = "IsokoHub"
APP_ENV = "production"
